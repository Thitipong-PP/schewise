name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # No external Go modules yet.
      - name: Check formatting
        run:
          test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o bin/schewise-api ./cmd/api

  web:
    name: Web and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit --audit-level high
      - run: make build
      - run: make smoke

  containers:
    name: Development containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Check container API and web integration
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/v1/health
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/api/v1/health
          curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:3000
      - name: Check API graceful shutdown
        run: |
          docker compose stop api
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q api)")" = 0
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop development containers
        if: always()
        run: docker compose down
