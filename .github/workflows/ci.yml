name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHEWISE_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-database-password@127.0.0.1:5432/schewise?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: schewise
          POSTGRES_PASSWORD: synthetic-ci-database-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d schewise" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run:
          test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o bin/schewise-api ./cmd/api

  web:
    name: Web and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: http://127.0.0.1:8080
      SCHEWISE_ORIGIN: https://localhost:8443
      SCHEWISE_ADMIN_EMAIL: admin@example.test
      SCHEWISE_ADMIN_PASSWORD: Synthetic-ci-administrator-password-42!
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: schewise
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-database-password
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: schewise
          POSTGRES_PASSWORD: synthetic-ci-database-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d schewise" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test:toolchain
      - run: pnpm typecheck
      - run: pnpm audit --audit-level high
      - run: make build
      - run: make smoke

  containers:
    name: Development containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: make init
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Check container API and web integration
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/v1/health
          make local-ca
          curl --cacert .local/root.crt --fail --silent --show-error --max-time 10 --retry 10 --retry-all-errors --retry-delay 1 https://localhost:8443/api/v1/health
          make auth-smoke
      - name: Check API graceful shutdown
        run: |
          docker compose stop api
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q api)")" = 0
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop development containers
        if: always()
        run: docker compose down
