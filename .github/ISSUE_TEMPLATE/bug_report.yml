name: Bug report
description: Report reproducible behavior that does not work as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please write in English. Do not include credentials or real database data.
        For vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include minimal steps or a synthetic example.
      placeholder: |
        1. Start the API with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description:
        Commit/version, OS, Go, Node.js, pnpm, browser, and Docker version if
        applicable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove secrets, connection strings, and personal information.
